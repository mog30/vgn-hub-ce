<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #animVideo,
    #reverseVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: transparent;
      opacity: 0;
      transform: none;
      filter: none;
    }

    #animVideo { z-index: 2; opacity: 1; }
    #reverseVideo { z-index: 1; }
  </style>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>

<body>
  <video
    id="animVideo"
    src="assets/mouse_v1.webm"
    muted
    playsinline
    preload="auto"
  ></video>

  <video
    id="reverseVideo"
    src="assets/mouse_v1_reverse.webm"
    muted
    playsinline
    preload="auto"
  ></video>

  <script>
    (() => {
      let localBridge = null;
      let reverseTimer = null;
      let commandId = 0;
      let ready = false;

      const video = document.getElementById("animVideo");
      const reverseVideo = document.getElementById("reverseVideo");

      function stopReverseTimer() {
        if (reverseTimer !== null) {
          cancelAnimationFrame(reverseTimer);
          clearTimeout(reverseTimer);
          reverseTimer = null;
        }
      }

      function signal(name) {
        if (localBridge && typeof localBridge[name] === "function") {
          localBridge[name]();
        }
      }

      function prepareVisual() {
        video.style.opacity = "1";
        reverseVideo.style.opacity = "0";
      }

      function waitForMetadata(target, callback) {
        if (Number.isFinite(target.duration) && target.duration > 0) {
          callback();
          return;
        }
        const once = () => callback();
        target.addEventListener("loadedmetadata", once, { once: true });
        target.load();
      }

      window.playForward = function() {
        const id = ++commandId;
        stopReverseTimer();
        reverseVideo.pause();
        reverseVideo.style.opacity = "0";
        video.style.opacity = "1";

        waitForMetadata(video, () => {
          if (id !== commandId) return;
          try {
            video.pause();
            video.currentTime = 0;
          } catch (_) {}

          const promise = video.play();
          if (promise && typeof promise.catch === "function") {
            promise.catch(() => {
              requestAnimationFrame(() => {
                if (id === commandId) video.play().catch(() => {});
              });
            });
          }
        });
      };

      window.playReverse = function() {
        const id = ++commandId;
        stopReverseTimer();
        video.pause();
        video.style.opacity = "0";

        waitForMetadata(reverseVideo, () => {
          if (id !== commandId) return;
          try {
            reverseVideo.pause();
            reverseVideo.currentTime = 0;
          } catch (_) {}

          reverseVideo.style.opacity = "1";
          const promise = reverseVideo.play();
          if (promise && typeof promise.catch === "function") {
            promise.catch(() => {
              requestAnimationFrame(() => {
                if (id === commandId) reverseVideo.play().catch(() => {});
              });
            });
          }
        });
      };

      video.addEventListener("ended", () => {
        if (video.currentTime >= video.duration - 0.05) {
          signal("onVideoEnded");
        }
      });

      reverseVideo.addEventListener("ended", () => {
        reverseVideo.pause();
        reverseVideo.style.opacity = "0";
        signal("onReverseEnded");
      });

      video.addEventListener("error", () => {
        console.error("Forward animation video error:", video.error);
      });

      reverseVideo.addEventListener("error", () => {
        console.error("Reverse animation video error. Generate assets/mouse_v1_reverse.webm from the original video.");
      });

      if (typeof qt !== "undefined") {
        new QWebChannel(qt.webChannelTransport, (channel) => {
          localBridge = channel.objects.pyBridge;
          signal("onVideoReady");
        });
      }

      video.addEventListener("loadedmetadata", () => {
        ready = true;
      });
    })();
  </script>
</body>
</html>
